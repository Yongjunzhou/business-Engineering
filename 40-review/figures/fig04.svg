<svg viewBox="0 0 680 240" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>系统工程包含软件工程与硬件工程</title>
<desc>系统工程是构建复杂系统的元工程，软件工程和硬件工程是其中的部件工程</desc>
<defs>
<marker id="arrow-4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="100" y="40" width="480" height="180" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">系统工程 = 构建复杂系统的工程（元工程）</text>
<text x="340" y="84" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">跨学科整合 · 接口管理 · 系统级验证</text>
<rect x="120" y="104" width="215" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="227" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">软件工程</text>
<text x="227" y="143" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">构建软件系统（部件工程）</text>
<rect x="350" y="104" width="215" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="457" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">硬件工程</text>
<text x="457" y="143" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">构建硬件系统（部件工程）</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">还有人因 · 流程 · 数据 —— 整体大于部分之和</text>
</svg>
