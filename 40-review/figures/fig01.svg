<text x="555" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">有用的人造物</text>
<text x="555" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">满足需求的解决方案</text>
<rect x="250" y="122" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">工程</text>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Engineering</text>
