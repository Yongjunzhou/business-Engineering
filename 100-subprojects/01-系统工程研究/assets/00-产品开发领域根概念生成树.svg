<svg viewBox="0 0 680 380" width="100%" role="img">
  <title>产品开发领域根概念生成树</title>
  <desc>需求、系统、设计是根概念（本体 = 价值 × 对象 × 行为），质量、功能、接口、组件、架构是它们在各自维度上的投影，产品是围绕价值 × 对象 × 行为的整合，共同构成产品开发体系。</desc>
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">产品开发领域 · 根概念生成树</text>

  <g>
    <rect x="40" y="70" width="150" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="115" y="85" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">需求（requirement）</text>
    <text x="115" y="103" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">价值维 · 要什么</text>
  </g>
  <g>
    <rect x="265" y="70" width="150" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="85" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">系统（system）</text>
    <text x="340" y="103" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">对象维 · 是什么</text>
  </g>
  <g>
    <rect x="490" y="70" width="150" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="565" y="85" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">设计（design）</text>
    <text x="565" y="103" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">行为维 · 怎么做</text>
  </g>

  <g>
    <rect x="40" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="90" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">质量</text>
    <text x="90" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">需求投影</text>
  </g>
  <g>
    <rect x="155" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="205" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">功能</text>
    <text x="205" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">需求投影</text>
  </g>
  <g>
    <rect x="270" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="320" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">接口</text>
    <text x="320" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">系统投影</text>
  </g>
  <g>
    <rect x="385" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="435" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">组件</text>
    <text x="435" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">系统投影</text>
  </g>
  <g>
    <rect x="500" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="550" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">架构</text>
    <text x="550" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">设计投影</text>
  </g>

  <g>
    <rect x="255" y="270" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">产品（广义产品）</text>
    <text x="340" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">围绕价值 × 对象 × 行为的整合</text>
  </g>

  <path d="M115,114 L90,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M115,114 L205,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M340,114 L320,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M340,114 L435,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M565,114 L550,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>

  <path d="M90,214 L285,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M205,214 L310,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M320,214 L330,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M435,214 L350,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>
  <path d="M550,214 L380,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow7)"/>

  <rect x="40" y="340" width="14" height="11" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="346" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">根概念（本体 · 不变量）</text>
  <rect x="270" y="340" width="14" height="11" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="290" y="346" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">投影/衍生（可重组）</text>
  <rect x="450" y="340" width="14" height="11" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="346" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">综合表现层</text>
</svg>
