<svg viewBox="0 0 680 380" width="100%" role="img">
  <title>企业运行体系根概念生成树（修正版）</title>
  <desc>产品数据是根概念，流程、组织、绩效、IT系统是它在不同维度上的投影，配置管理是产品数据的受控管理，共同构成企业运行体系。</desc>
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">企业运行体系 · 根概念生成树（修正版）</text>

  <g>
    <rect x="245" y="70" width="190" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="85" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">产品数据（广义产品）</text>
    <text x="340" y="103" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">本体 · 企业运行的"货" · 唯一根概念</text>
  </g>

  <g>
    <rect x="40" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="90" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">流程</text>
    <text x="90" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">时间投影</text>
  </g>
  <g>
    <rect x="155" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="205" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">组织</text>
    <text x="205" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">空间投影</text>
  </g>
  <g>
    <rect x="270" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="320" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">绩效</text>
    <text x="320" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">价值投影</text>
  </g>
  <g>
    <rect x="385" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="435" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">配置管理</text>
    <text x="435" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">受控管理本身</text>
  </g>
  <g>
    <rect x="500" y="170" width="100" height="44" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="550" y="185" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">IT 系统</text>
    <text x="550" y="203" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">数字化载体</text>
  </g>

  <g>
    <rect x="255" y="270" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">企业运行体系</text>
    <text x="340" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">围绕产品数据的组织化运转</text>
  </g>

  <path d="M295,114 L105,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M320,114 L210,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M340,114 L325,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M360,114 L440,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M385,114 L550,170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>

  <path d="M105,214 L290,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M210,214 L310,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M325,214 L335,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M440,214 L355,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>
  <path d="M550,214 L380,270" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow5)"/>

  <rect x="40" y="340" width="14" height="11" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="346" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">根概念（本体 · 不变量）</text>
  <rect x="270" y="340" width="14" height="11" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="290" y="346" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">投影/衍生（可重组）</text>
  <rect x="450" y="340" width="14" height="11" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="346" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">综合表现层</text>
</svg>
