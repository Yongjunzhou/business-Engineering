<svg xmlns="http://www.w3.org/2000/svg" width="660" height="935" viewBox="0 0 660 935"
     font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <!-- 图1-5 全书认知链 · 两列蛇形（mermaid 11.16 子图方向失效，手绘 SVG 替代）
       左列 第1~8章 上→下；右列 第9~17章 上→下；底部回绕箭头 第8章→第9章 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- ══ 左列：第1~8章（cx=165） ══ -->
  <g>
    <rect x="30"   y="20"  width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="49" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第1章 核心概念能力：学习的杠杆</text>
    <text x="165" y="70" font-size="12.5" fill="#666" text-anchor="middle">发能力</text>
  </g>
  <g>
    <rect x="30"   y="115" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="144" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第2章 工程</text>
    <text x="165" y="165" font-size="12.5" fill="#666" text-anchor="middle">我们在做什么</text>
  </g>
  <g>
    <rect x="30"   y="210" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="239" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第3章 三基座</text>
    <text x="165" y="260" font-size="12.5" fill="#666" text-anchor="middle">定/造/读标尺</text>
  </g>
  <g>
    <rect x="30"   y="305" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="334" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第4章 需求工程</text>
    <text x="165" y="355" font-size="12.5" fill="#666" text-anchor="middle">标尺从哪来</text>
  </g>
  <g>
    <rect x="30"   y="400" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="429" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第5章 需求的完整性</text>
    <text x="165" y="450" font-size="12.5" fill="#666" text-anchor="middle">三类需求+载体</text>
  </g>
  <g>
    <rect x="30"   y="495" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="524" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第6章 设计开发落地</text>
    <text x="165" y="545" font-size="12.5" fill="#666" text-anchor="middle">树+三操作</text>
  </g>
  <g>
    <rect x="30"   y="590" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="619" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第7章 产品数据</text>
    <text x="165" y="640" font-size="12.5" fill="#666" text-anchor="middle">开发的是数据</text>
  </g>
  <g>
    <rect x="30"   y="685" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="165" y="714" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第8章 评审验证确认</text>
    <text x="165" y="735" font-size="12.5" fill="#666" text-anchor="middle">三个看门人</text>
  </g>

  <!-- ══ 右列：第9~17章（cx=495） ══ -->
  <g>
    <rect x="360"  y="20"  width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="49" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第9章 工程师</text>
    <text x="495" y="70" font-size="12.5" fill="#666" text-anchor="middle">把四层背在身上</text>
  </g>
  <g>
    <rect x="360"  y="115" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="144" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第10章 架构</text>
    <text x="495" y="165" font-size="12.5" fill="#666" text-anchor="middle">最重要的决定</text>
  </g>
  <g>
    <rect x="360"  y="210" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="239" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第11章 架构设计</text>
    <text x="495" y="260" font-size="12.5" fill="#666" text-anchor="middle">概念·属性·原则</text>
  </g>
  <g>
    <rect x="360"  y="305" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="334" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第12章 架构决策</text>
    <text x="495" y="355" font-size="12.5" fill="#666" text-anchor="middle">不可逆决策</text>
  </g>
  <g>
    <rect x="360"  y="400" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="429" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第13章 配置管理</text>
    <text x="495" y="450" font-size="12.5" fill="#666" text-anchor="middle">让变说得清</text>
  </g>
  <g>
    <rect x="360"  y="495" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="524" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第14章 治理</text>
    <text x="495" y="545" font-size="12.5" fill="#666" text-anchor="middle">谁掌舵</text>
  </g>
  <g>
    <rect x="360"  y="590" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="619" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第15章 架构定义落地</text>
    <text x="495" y="640" font-size="12.5" fill="#666" text-anchor="middle">从目的到架构视图</text>
  </g>
  <g>
    <rect x="360"  y="685" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="714" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第16章 整合</text>
    <text x="495" y="735" font-size="12.5" fill="#666" text-anchor="middle">走完全程</text>
  </g>
  <g>
    <rect x="360"  y="780" width="270" height="70" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
    <text x="495" y="809" font-size="15" font-weight="600" fill="#333" text-anchor="middle">第17章 架构师</text>
    <text x="495" y="830" font-size="12.5" fill="#666" text-anchor="middle">从工程师到架构师</text>
  </g>

  <!-- ══ 左列内部箭头（x=165） ══ -->
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 165 90  L 165 112"/>
    <path d="M 165 185 L 165 207"/>
    <path d="M 165 280 L 165 302"/>
    <path d="M 165 375 L 165 397"/>
    <path d="M 165 470 L 165 492"/>
    <path d="M 165 565 L 165 587"/>
    <path d="M 165 660 L 165 682"/>
  </g>
  <!-- ══ 右列内部箭头（x=495） ══ -->
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 495 90  L 495 112"/>
    <path d="M 495 185 L 495 207"/>
    <path d="M 495 280 L 495 302"/>
    <path d="M 495 375 L 495 397"/>
    <path d="M 495 470 L 495 492"/>
    <path d="M 495 565 L 495 587"/>
    <path d="M 495 660 L 495 682"/>
    <path d="M 495 755 L 495 777"/>
  </g>
  <!-- ══ 回绕箭头：第8章（165,760）→ 经底部中缝 → 第9章（495,20） ══ -->
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 165 760
             L 165 905
             Q 165 912 172 912
             L 323 912
             Q 330 912 330 905
             L 330 27
             Q 330 20 337 20
             L 488 20
             Q 495 20 495 27
             L 495 33"/>
  </g>
</svg>
